# Builds of DJSync (Windows, macOS, Linux) and GitHub releases.
#
# V1.2.0: macOS (DJSync.app, Apple silicon, in a .dmg disk image) and Linux (DJSync folder, tar.gz) are built too,
# with their own audio-only FFmpeg and QuickJS, self-tested, and attached to the same release.
#
# Result: ONE file, DJSync.exe (launcher + application). Users download it, put it anywhere (USB
# stick root), double-click. On first launch it extracts the application into the hidden folder
# .djsync next to itself (once, or after an update; settings in .djsync/data are kept), then starts.
# Stable download link of the latest release: https://github.com/<owner>/<repo>/releases/latest/download/DJSync.exe
#
# Releasing: push a tag matching djsync/__init__.py's version.
#   git tag v1.0.0-rc.1 && git push origin v1.0.0-rc.1   -> PRE-release (to test on real hardware)
#   git tag v1.0.0      && git push origin v1.0.0        -> release (marked "latest")
# The release gets DJSync.exe, its SHA-256 and notes built from the README (packaging/release_notes.py).
# A draft release prepared on GitHub does NOT create its tag (only publishing does): push the tag, the
# workflow then fills the draft and publishes it.
# A manual run (Actions > Windows build > Run workflow) only builds DJSync.exe as a run artifact.
#
# Code signing (optional): add the repository secrets
#   SIGN_CERT_PFX       the .pfx certificate, base64-encoded   (certutil -encode cert.pfx cert.b64)
#   SIGN_CERT_PASSWORD  its password
# Without them the exe is built unsigned (Windows SmartScreen shows "unknown publisher" once).
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: mingw-w64
        timeout-minutes: 10              # apt bloqué sur un miroir : échec rapide au lieu de 6 h
        run: |
          sudo apt-get update -q -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -q -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 gcc-mingw-w64-x86-64 nasm make
      - uses: actions/cache@v6
        id: cache
        with:
          path: ffmpeg-out
          key: ffmpeg-audio-${{ hashFiles('packaging/build_ffmpeg.sh') }}
      - name: Cross-compile audio-only FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: packaging/build_ffmpeg.sh ffmpeg-out
      - name: Single-file launcher
        run: |
          if ! packaging/build_launcher.sh launcher-out > launcher.log 2>&1; then
            echo "::error title=launcher::$(tail -c 3000 launcher.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg
          path: ffmpeg-out
      - uses: actions/upload-artifact@v7
        with:
          name: launcher
          path: launcher-out

  build:
    needs: tools
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SIGN_CERT_PFX: ${{ secrets.SIGN_CERT_PFX }}
      SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Version
        id: name
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            python packaging/release_notes.py "${{ github.ref_name }}" > $null
            if ($LASTEXITCODE -ne 0) { exit 1 }          # tag and djsync.__version__ disagree
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $base = python -c "import djsync; print(djsync.__version__)"
            python packaging/release_notes.py "v$base" > $null   # same check as a release, without publishing
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $v = "$base-dev." + "${{ github.sha }}".Substring(0, 7)  # each build re-extracts on first launch
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "VERSION = `"$v`"" | Out-File -Encoding ascii djsync/_build_version.py   # full version shown and used by updates
      - name: Clean environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        continue-on-error: true          # reported as annotations, do not block the build
        env:
          QT_QPA_PLATFORM: offscreen
          DJSYNC_AUDIO_NULL: "1"
        shell: pwsh
        run: |
          python -m pytest -q -rfE --junitxml=pytest.xml
          $code = $LASTEXITCODE
          python packaging/ci_annotate.py pytest.xml
          exit $code
      - name: Build the application folder
        run: pyinstaller --noconfirm packaging/DJSync.spec
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg
          path: dist/DJSync/tools
      - uses: actions/download-artifact@v8
        with:
          name: launcher
          path: launcher
      - name: QuickJS-NG (JavaScript runtime for yt-dlp)
        shell: pwsh
        run: |
          # runner network is sometimes flaky: 5 attempts before failing
          $url = "https://github.com/quickjs-ng/quickjs/releases/latest/download/qjs-windows-x86_64.exe"
          for ($i = 1; $i -le 5; $i++) {
            try { Invoke-WebRequest $url -OutFile dist/DJSync/tools/qjs.exe -TimeoutSec 60; break }
            catch { if ($i -eq 5) { throw }; Write-Host "Download failed ($i/5), retrying"; Start-Sleep 10 }
          }
      - name: Sign the application
        if: ${{ env.SIGN_CERT_PFX != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:SIGN_CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:SIGN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist/DJSync/DJSync.exe launcher/launcher.exe
      - name: Pack into ONE file
        run: python packaging/pack_single_exe.py launcher/launcher.exe dist/DJSync "${{ steps.name.outputs.version }}" out/DJSync.exe
      - name: Sign DJSync.exe
        if: ${{ env.SIGN_CERT_PFX != '' }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:SIGN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 out/DJSync.exe
          Remove-Item cert.pfx
      - name: Smoke test (DJSync.exe alone in an empty folder, as a user would run it)
        shell: pwsh
        run: |
          $usb = "$env:RUNNER_TEMP\usb"
          New-Item -ItemType Directory $usb | Out-Null
          Copy-Item out/DJSync.exe $usb
          $report = "$env:RUNNER_TEMP\selftest.json"
          $env:DJSYNC_SELFTEST = $report               # the launcher waits for the app and returns its code
          $p = Start-Process "$usb\DJSync.exe" -Wait -PassThru
          Remove-Item Env:DJSYNC_SELFTEST
          $bad = @()
          if (-not (Test-Path $report)) { $bad += "no self-test report (extraction or start failed, exit $($p.ExitCode))" }
          else {
            Get-Content $report
            $r = Get-Content $report | ConvertFrom-Json
            $bad += @($r.checks.PSObject.Properties | Where-Object { -not $_.Value.ok } | ForEach-Object { "$($_.Name): $($_.Value.error)" })
            if (-not $r.checks.yt_dlp.value.ejs) { $bad += "yt_dlp: yt-dlp-ejs (YouTube JavaScript solver) missing" }
            if (-not $r.checks.tools.value.js.quickjs) { $bad += "tools: bundled QuickJS not found" }
          }
          if (-not (Test-Path "$usb\.djsync\app\DJSync.exe")) { $bad += "launcher: .djsync\app not extracted" }
          $attr = (Get-Item "$usb\.djsync" -Force).Attributes
          if (-not ($attr -band [IO.FileAttributes]::Hidden)) { $bad += "launcher: .djsync not hidden ($attr)" }
          $visible = @(Get-ChildItem $usb).Name
          $files = (Get-ChildItem "$usb\.djsync" -Recurse -File -Force).Count
          $mb = [math]::Round((Get-Item out/DJSync.exe).Length / 1MB, 1)
          "::notice title=DJSync.exe::$mb MB, $files files extracted, visible: $($visible -join ', '), self-test exit $($p.ExitCode)"
          if ($bad.Count -gt 0 -or $p.ExitCode -ne 0) {
            foreach ($b in $bad) { "::error title=self-test::$b" }
            exit 1
          }
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash out/DJSync.exe -Algorithm SHA256).Hash.ToLower()
          "$h  DJSync.exe" | Out-File -Encoding ascii out/DJSync.exe.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: DJSync-windows
          path: |
            out/DJSync.exe
            out/DJSync.exe.sha256

  macos:
    # Apple silicon (arm64). GitHub's Mac runners are sometimes unavailable: the job is then cancelled
    # without blocking the release; "Re-run failed jobs" on the tag's run later builds the .dmg and
    # attaches it to the existing release.
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Version
        id: name
        run: |
          base=$(python -c "import djsync; print(djsync.__version__)")
          if [ "${{ github.ref_type }}" = tag ]; then
            python packaging/release_notes.py "${{ github.ref_name }}" > /dev/null
            v="${GITHUB_REF_NAME#v}"
          else
            python packaging/release_notes.py "v$base" > /dev/null
            v="$base-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "VERSION = \"$v\"" > djsync/_build_version.py      # full version shown and used by updates
      - uses: actions/cache@v6
        id: cache
        with:
          path: ffmpeg-out
          key: ffmpeg-audio-macos-arm64-${{ hashFiles('packaging/build_ffmpeg.sh') }}
      - name: Audio-only FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: TARGET=native packaging/build_ffmpeg.sh ffmpeg-out
      - name: Clean environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          DJSYNC_AUDIO_NULL: "1"
        run: |
          python -m pytest -q -rfE --junitxml=pytest.xml || code=$?
          python packaging/ci_annotate.py pytest.xml
          exit ${code:-0}
      - name: Build DJSync.app
        env:
          DJSYNC_VERSION: ${{ steps.name.outputs.version }}
        run: pyinstaller --noconfirm packaging/DJSync.spec
      - name: Bundled tools (FFmpeg, QuickJS-NG)
        run: |
          T=dist/DJSync.app/Contents/MacOS/tools
          mkdir -p "$T"
          cp ffmpeg-out/ffmpeg ffmpeg-out/ffprobe ffmpeg-out/FFMPEG_LICENSE.txt "$T/"
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 -o "$T/qjs" https://github.com/quickjs-ng/quickjs/releases/latest/download/qjs-darwin-arm64
          chmod +x "$T/ffmpeg" "$T/ffprobe" "$T/qjs"
          codesign --force --deep -s - dist/DJSync.app          # ad-hoc signature (required on Apple silicon)
      - name: Smoke test (DJSync.app alone on a "drive")
        run: |
          usb="$RUNNER_TEMP/usb"; mkdir -p "$usb"
          ditto dist/DJSync.app "$usb/DJSync.app"
          DJSYNC_SELFTEST="$RUNNER_TEMP/selftest.json" QT_QPA_PLATFORM=offscreen "$usb/DJSync.app/Contents/MacOS/DJSync" || true
          python packaging/check_selftest.py "$RUNNER_TEMP/selftest.json"
      - name: Disk image (.dmg) and checksum
        run: |
          pip install dmgbuild
          mkdir -p out
          tiffutil -cathidpicheck packaging/dmg_background.png packaging/dmg_background@2x.png -out "$RUNNER_TEMP/bg.tiff"
          dmgbuild -s packaging/dmg_settings.py -D app=dist/DJSync.app -D background="$RUNNER_TEMP/bg.tiff" \
            "DJSync" out/DJSync-macOS.dmg
          hdiutil verify out/DJSync-macOS.dmg
          mnt=$(hdiutil attach -nobrowse -readonly out/DJSync-macOS.dmg | tail -1 | cut -f3)
          test -x "$mnt/DJSync.app/Contents/MacOS/DJSync" && test -x "$mnt/DJSync.app/Contents/MacOS/tools/ffmpeg"
          hdiutil detach "$mnt"
          (cd out && shasum -a 256 DJSync-macOS.dmg > DJSync-macOS.dmg.sha256)
          echo "::notice title=DJSync-macOS.dmg::$(du -h out/DJSync-macOS.dmg | cut -f1)"
      - uses: actions/upload-artifact@v7
        with:
          name: DJSync-macos
          path: out/*
      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # the release is created by the "release" job (Windows + Linux); wait for it (up to 1 h)
          for i in $(seq 1 120); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 30; done
          gh release upload "$TAG" out/* --clobber

  linux:
    runs-on: ubuntu-22.04                   # oldest supported glibc: runs on most distributions
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Version
        id: name
        run: |
          base=$(python -c "import djsync; print(djsync.__version__)")
          if [ "${{ github.ref_type }}" = tag ]; then
            python packaging/release_notes.py "${{ github.ref_name }}" > /dev/null
            v="${GITHUB_REF_NAME#v}"
          else
            python packaging/release_notes.py "v$base" > /dev/null
            v="$base-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "VERSION = \"$v\"" > djsync/_build_version.py      # full version shown and used by updates
      - name: System packages
        timeout-minutes: 10
        run: |
          sudo apt-get update -q -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -q -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 nasm libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libgl1
      - uses: actions/cache@v6
        id: cache
        with:
          path: ffmpeg-out
          key: ffmpeg-audio-linux-x86_64-${{ hashFiles('packaging/build_ffmpeg.sh') }}
      - name: Audio-only FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: TARGET=native packaging/build_ffmpeg.sh ffmpeg-out
      - name: Clean environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          DJSYNC_AUDIO_NULL: "1"
        run: |
          python -m pytest -q -rfE --junitxml=pytest.xml || code=$?
          python packaging/ci_annotate.py pytest.xml
          exit ${code:-0}
      - name: Build the DJSync folder
        run: pyinstaller --noconfirm packaging/DJSync.spec
      - name: Bundled tools (FFmpeg, QuickJS-NG)
        run: |
          T=dist/DJSync/tools
          mkdir -p "$T"
          cp ffmpeg-out/ffmpeg ffmpeg-out/ffprobe ffmpeg-out/FFMPEG_LICENSE.txt "$T/"
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 -o "$T/qjs" https://github.com/quickjs-ng/quickjs/releases/latest/download/qjs-linux-x86_64
          chmod +x "$T/ffmpeg" "$T/ffprobe" "$T/qjs"
      - name: Smoke test (DJSync folder alone on a "drive")
        run: |
          usb="$RUNNER_TEMP/usb"; mkdir -p "$usb"
          cp -a dist/DJSync "$usb/"
          DJSYNC_SELFTEST="$RUNNER_TEMP/selftest.json" QT_QPA_PLATFORM=offscreen "$usb/DJSync/DJSync" || true
          python packaging/check_selftest.py "$RUNNER_TEMP/selftest.json"
      - name: Archive and checksum
        run: |
          mkdir -p out
          tar czf out/DJSync-Linux-x86_64.tar.gz -C dist DJSync
          (cd out && sha256sum DJSync-Linux-x86_64.tar.gz > DJSync-Linux-x86_64.tar.gz.sha256)
          echo "::notice title=DJSync-Linux-x86_64.tar.gz::$(du -h out/DJSync-Linux-x86_64.tar.gz | cut -f1)"
      - uses: actions/upload-artifact@v7
        with:
          name: DJSync-linux
          path: out/*

  release:
    if: github.ref_type == 'tag'
    needs: [build, linux]          # macOS attaches its file itself (Apple silicon runners are often busy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: DJSync-windows
          path: out
      - uses: actions/download-artifact@v8
        with:
          name: DJSync-linux
          path: out
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 packaging/release_notes.py "$TAG" > notes.md
          flags=""
          case "$TAG" in *-*) flags="--prerelease";; *) flags="--latest";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            # brouillon préparé sur GitHub : on le complète (notes, titre) et on le publie
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
              gh release edit "$TAG" --title "DJSync ${TAG#v}" --notes-file notes.md --draft=false $flags
            fi
          else
            gh release create "$TAG" out/* --title "DJSync ${TAG#v}" --notes-file notes.md $flags --verify-tag
          fi

# Portable Windows build of DJSync (V0.5.0).
# Result: DJSync-windows.zip = DJSync.exe + hidden ".djsync" folder (Python, Qt, audio-only FFmpeg,
# QuickJS for yt-dlp). Unzip it at the root of the USB stick: the user only sees DJSync.exe.
#
# Code signing (optional): add the repository secrets
#   SIGN_CERT_PFX       the .pfx certificate, base64-encoded   (certutil -encode cert.pfx cert.b64)
#   SIGN_CERT_PASSWORD  its password
# Without them the exe is built unsigned (Windows SmartScreen shows "unknown publisher" once).
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  ffmpeg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        id: cache
        with:
          path: ffmpeg-out
          key: ffmpeg-audio-${{ hashFiles('packaging/build_ffmpeg.sh') }}
      - name: Cross-compile audio-only FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64 nasm make
          packaging/build_ffmpeg.sh ffmpeg-out
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg
          path: ffmpeg-out

  build:
    needs: ffmpeg
    runs-on: windows-latest
    env:
      SIGN_CERT_PFX: ${{ secrets.SIGN_CERT_PFX }}
      SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Clean environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        continue-on-error: true          # first Windows runs: report failures without blocking the build
        env:
          QT_QPA_PLATFORM: offscreen
          DJSYNC_AUDIO_NULL: "1"
        shell: pwsh
        run: |
          python -m pytest -q -rfE --junitxml=pytest.xml
          $code = $LASTEXITCODE
          python packaging/ci_annotate.py pytest.xml
          exit $code
      - name: Build
        run: pyinstaller --noconfirm packaging/DJSync.spec
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg
          path: dist/DJSync/.djsync/tools
      - name: QuickJS-NG (JavaScript runtime for yt-dlp)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/quickjs-ng/quickjs/releases/latest/download/qjs-windows-x86_64.exe -OutFile dist/DJSync/.djsync/tools/qjs.exe
          New-Item dist/DJSync/.djsync/portable.flag -ItemType File | Out-Null
      - name: Smoke test
        shell: pwsh
        run: |
          dist/DJSync/.djsync/tools/ffmpeg.exe -hide_banner -version | Select-Object -First 1
          dist/DJSync/.djsync/tools/qjs.exe -e "print(1+1)"
      - name: Sign
        if: ${{ env.SIGN_CERT_PFX != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:SIGN_CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:SIGN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist/DJSync/DJSync.exe
          Remove-Item cert.pfx
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/DJSync/* -DestinationPath DJSync-windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: DJSync-windows
          path: DJSync-windows.zip

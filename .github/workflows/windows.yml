# Portable Windows build of DJSync, and GitHub releases.
#
# Result: ONE file, DJSync.exe (launcher + application). Users download it, put it anywhere (USB
# stick root), double-click. On first launch it extracts the application into the hidden folder
# .djsync next to itself (once, or after an update; settings in .djsync/data are kept), then starts.
# Stable download link of the latest release: https://github.com/<owner>/<repo>/releases/latest/download/DJSync.exe
#
# Releasing: push a tag matching djsync/__init__.py's version.
#   git tag v1.0.0-rc.1 && git push origin v1.0.0-rc.1   -> PRE-release (to test on real hardware)
#   git tag v1.0.0      && git push origin v1.0.0        -> release (marked "latest")
# The release gets DJSync.exe, its SHA-256 and notes built from the README (packaging/release_notes.py).
# A draft release prepared on GitHub does NOT create its tag (only publishing does): push the tag, the
# workflow then fills the draft and publishes it.
# A manual run (Actions > Windows build > Run workflow) only builds DJSync.exe as a run artifact.
#
# Code signing (optional): add the repository secrets
#   SIGN_CERT_PFX       the .pfx certificate, base64-encoded   (certutil -encode cert.pfx cert.b64)
#   SIGN_CERT_PASSWORD  its password
# Without them the exe is built unsigned (Windows SmartScreen shows "unknown publisher" once).
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: mingw-w64
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64 nasm make
      - uses: actions/cache@v6
        id: cache
        with:
          path: ffmpeg-out
          key: ffmpeg-audio-${{ hashFiles('packaging/build_ffmpeg.sh') }}
      - name: Cross-compile audio-only FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: packaging/build_ffmpeg.sh ffmpeg-out
      - name: Single-file launcher
        run: packaging/build_launcher.sh launcher-out
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg
          path: ffmpeg-out
      - uses: actions/upload-artifact@v7
        with:
          name: launcher
          path: launcher-out

  build:
    needs: tools
    runs-on: windows-latest
    env:
      SIGN_CERT_PFX: ${{ secrets.SIGN_CERT_PFX }}
      SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Version
        id: name
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            python packaging/release_notes.py "${{ github.ref_name }}" > $null
            if ($LASTEXITCODE -ne 0) { exit 1 }          # tag and djsync.__version__ disagree
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $base = python -c "import djsync; print(djsync.__version__)"
            python packaging/release_notes.py "v$base" > $null   # same check as a release, without publishing
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $v = "$base-dev." + "${{ github.sha }}".Substring(0, 7)  # each build re-extracts on first launch
          }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Clean environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        continue-on-error: true          # reported as annotations, do not block the build
        env:
          QT_QPA_PLATFORM: offscreen
          DJSYNC_AUDIO_NULL: "1"
        shell: pwsh
        run: |
          python -m pytest -q -rfE --junitxml=pytest.xml
          $code = $LASTEXITCODE
          python packaging/ci_annotate.py pytest.xml
          exit $code
      - name: Build the application folder
        run: pyinstaller --noconfirm packaging/DJSync.spec
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg
          path: dist/DJSync/tools
      - uses: actions/download-artifact@v8
        with:
          name: launcher
          path: launcher
      - name: QuickJS-NG (JavaScript runtime for yt-dlp)
        shell: pwsh
        run: Invoke-WebRequest https://github.com/quickjs-ng/quickjs/releases/latest/download/qjs-windows-x86_64.exe -OutFile dist/DJSync/tools/qjs.exe
      - name: Sign the application
        if: ${{ env.SIGN_CERT_PFX != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:SIGN_CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:SIGN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist/DJSync/DJSync.exe launcher/launcher.exe
      - name: Pack into ONE file
        run: python packaging/pack_single_exe.py launcher/launcher.exe dist/DJSync "${{ steps.name.outputs.version }}" out/DJSync.exe
      - name: Sign DJSync.exe
        if: ${{ env.SIGN_CERT_PFX != '' }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:SIGN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 out/DJSync.exe
          Remove-Item cert.pfx
      - name: Smoke test (DJSync.exe alone in an empty folder, as a user would run it)
        shell: pwsh
        run: |
          $usb = "$env:RUNNER_TEMP\usb"
          New-Item -ItemType Directory $usb | Out-Null
          Copy-Item out/DJSync.exe $usb
          $report = "$env:RUNNER_TEMP\selftest.json"
          $env:DJSYNC_SELFTEST = $report               # the launcher waits for the app and returns its code
          $p = Start-Process "$usb\DJSync.exe" -Wait -PassThru
          Remove-Item Env:DJSYNC_SELFTEST
          $bad = @()
          if (-not (Test-Path $report)) { $bad += "no self-test report (extraction or start failed, exit $($p.ExitCode))" }
          else {
            Get-Content $report
            $r = Get-Content $report | ConvertFrom-Json
            $bad += @($r.checks.PSObject.Properties | Where-Object { -not $_.Value.ok } | ForEach-Object { "$($_.Name): $($_.Value.error)" })
            if (-not $r.checks.yt_dlp.value.ejs) { $bad += "yt_dlp: yt-dlp-ejs (YouTube JavaScript solver) missing" }
            if (-not $r.checks.tools.value.js.quickjs) { $bad += "tools: bundled QuickJS not found" }
          }
          if (-not (Test-Path "$usb\.djsync\app\DJSync.exe")) { $bad += "launcher: .djsync\app not extracted" }
          $attr = (Get-Item "$usb\.djsync" -Force).Attributes
          if (-not ($attr -band [IO.FileAttributes]::Hidden)) { $bad += "launcher: .djsync not hidden ($attr)" }
          $visible = @(Get-ChildItem $usb).Name
          $files = (Get-ChildItem "$usb\.djsync" -Recurse -File -Force).Count
          $mb = [math]::Round((Get-Item out/DJSync.exe).Length / 1MB, 1)
          "::notice title=DJSync.exe::$mb MB, $files files extracted, visible: $($visible -join ', '), self-test exit $($p.ExitCode)"
          if ($bad.Count -gt 0 -or $p.ExitCode -ne 0) {
            foreach ($b in $bad) { "::error title=self-test::$b" }
            exit 1
          }
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash out/DJSync.exe -Algorithm SHA256).Hash.ToLower()
          "$h  DJSync.exe" | Out-File -Encoding ascii out/DJSync.exe.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: DJSync-windows
          path: |
            out/DJSync.exe
            out/DJSync.exe.sha256

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: DJSync-windows
          path: out
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 packaging/release_notes.py "$TAG" > notes.md
          flags=""
          case "$TAG" in *-*) flags="--prerelease";; *) flags="--latest";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            # brouillon préparé sur GitHub : on le complète (notes, titre) et on le publie
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
              gh release edit "$TAG" --title "DJSync ${TAG#v}" --notes-file notes.md --draft=false $flags
            fi
          else
            gh release create "$TAG" out/* --title "DJSync ${TAG#v}" --notes-file notes.md $flags --verify-tag
          fi

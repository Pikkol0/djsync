# C91 (1.3.1): tests only, without building or publishing anything, so the "Build" list keeps only
# the releases (tags). Started by hand on a branch (Actions ▸ Tests ▸ Run workflow, or the API),
# or by pushing to a ci/... branch:
#   - during development: quick run, Windows and Linux, slow UI tests left out (~3 min);
#   - when a pull request is ready: full = true (slow tests too) and mac = true (macOS tests).
# The durations of every test are published (annotations + job summary) to keep the suite fast.
name: Tests

on:
  # Claude: push a copy of a branch to ci/<name> (quick run) or ci/full/<name> (slow tests too);
  # these runs only show under "Tests". Usable before this file reaches main (manual runs need it there).
  push:
    branches: ["ci/**"]
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the slow UI tests"
        type: boolean
        default: false
      mac:
        description: "Also test on macOS (runners are often busy)"
        type: boolean
        default: false

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, shard: 1, shards: 2}
          - {os: windows-latest, shard: 2, shards: 2}
          - {os: ubuntu-22.04, shard: 1, shards: 1}
    name: tests (${{ matrix.os }}${{ matrix.shards > 1 && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: System packages (Qt offscreen)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update -q -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -q -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libgl1
      - name: Environment
        run: pip install -r requirements.txt pytest pytest-xdist
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          DJSYNC_AUDIO_NULL: "1"
          DJSYNC_FAST_EXIT: "1"
          DJSYNC_SHARD: ${{ matrix.shard }}
          DJSYNC_SHARDS: ${{ matrix.shards }}
          MARKERS: ${{ (inputs.full || startsWith(github.ref_name, 'ci/full/')) && 'slow or not slow' || 'not slow' }}
        shell: bash
        run: |
          python -m pytest -q -rfE -n auto --dist loadfile -m "$MARKERS" --junitxml=pytest.xml || code=$?
          python packaging/ci_annotate.py pytest.xml --durations
          exit ${code:-0}

  # macOS only when asked (a macOS job waits for a free runner, sometimes for hours)
  tests-mac:
    if: inputs.mac
    strategy:
      matrix:
        include:
          - {os: macos-15, shard: 1, shards: 1}
    name: tests (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: System packages (Qt offscreen)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update -q -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -q -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libgl1
      - name: Environment
        run: pip install -r requirements.txt pytest pytest-xdist
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          DJSYNC_AUDIO_NULL: "1"
          DJSYNC_FAST_EXIT: "1"
          DJSYNC_SHARD: ${{ matrix.shard }}
          DJSYNC_SHARDS: ${{ matrix.shards }}
          MARKERS: ${{ (inputs.full || startsWith(github.ref_name, 'ci/full/')) && 'slow or not slow' || 'not slow' }}
        shell: bash
        run: |
          python -m pytest -q -rfE -n auto --dist loadfile -m "$MARKERS" --junitxml=pytest.xml || code=$?
          python packaging/ci_annotate.py pytest.xml --durations
          exit ${code:-0}
